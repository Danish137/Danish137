name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for writing back to repo

      - name: Generate snake
        uses: Platane/snk@master
        with:
          github_user_name: Danish137
          svg_out_path: github-snake.svg
          outputs: |
            github-snake.svg
          color_snake: "#22c55e"
          color_dots: "#0f172a"
          color_dots_empty: "#020617"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add github-snake.svg || exit 1
          git commit -m "Update snake" || echo "No changes to commit"
          git push origin main
